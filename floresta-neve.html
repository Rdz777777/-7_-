<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Curioso demais 🌲</title>
<style>
:root{
  --sky-top:#0b1a2e; --sky-mid:#1f3a5a; --sky-low:#9ec3dc;
  --snow:#f4f9fc; --pine-far:#27465f; --pine-near:#0f2a2a;
  --text:#f4f9fc;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%}
*{box-sizing:border-box}
body{
  margin:0;min-height:100%;color:var(--text);
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 55%,var(--sky-low) 100%);
  background-attachment:fixed;overflow-x:hidden;
}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.forest{position:fixed;left:0;right:0;bottom:0;height:46vh;z-index:1;pointer-events:none}
.forest svg{width:100%;height:100%;display:block}
main{
  position:relative;z-index:2;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:28px;padding:36px 20px 30vh;text-align:center;
}
h1{
  margin:0;max-width:16ch;
  font-family:Georgia,"Times New Roman",serif;font-weight:700;
  font-size:clamp(28px,7vw,52px);line-height:1.18;
  text-shadow:0 2px 18px rgba(0,0,0,.45);
}
.foto{
  width:min(78vw,340px);aspect-ratio:3/4;border-radius:18px;
  border:6px solid var(--snow);background:rgba(244,249,252,.12);
  box-shadow:0 14px 40px rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;padding:20px;overflow:hidden;
}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.assinatura{margin:0;font-size:clamp(20px,5vw,28px);letter-spacing:.5px;text-shadow:0 2px 14px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:reduce){canvas{display:none}}
</style>
</head>

    x.clearRect(0,0,w,h);x.fillStyle='rgba(255,255,255,.9)';
    f.forEach(function(p){
      p.d+=.012;p.y+=p.v;p.x+=Math.sin(p.d)*.5;
      if(p.y>h){p.y=-5;p.x=Math.random()*w}
      x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill();
    });
    requestAnimationFrame(anima);
  }
  anima();
})();
</script>
